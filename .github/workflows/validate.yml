name: validate ontology
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python tools/validate.py
      # The site build is also a smoke test of every derived view.
      - run: python tools/build_site.py
      # No path filter: any tracked file the build rewrites should be committed.
      # site/ is gitignored, so a diff here means a generated-and-committed view
      # is behind the records it derives from.
      - name: generated views are up to date
        run: |
          git diff --exit-code \
            || { echo "::error::a generated file is stale; run tools/build_site.py and commit the result."; exit 1; }
