name: validate ontology
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python tools/validate.py
      # The site build is also a smoke test of every derived view.
      - run: python tools/build_site.py
      - name: glossary/index.md is up to date
        run: |
          git diff --exit-code -- glossary/index.md \
            || { echo "::error::glossary/index.md is stale; run tools/build_site.py and commit."; exit 1; }
