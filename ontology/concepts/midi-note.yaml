id: midi_note
labels:
  - {text: MIDI note, language: en}
senses:
  - id: midi_note.protocol
    orientation: "A protocol-level note identifier/event convention; not intrinsically identical to a frequency, pitch category, written note, or pitch class."
    domains: [representation, computation]
    roles: [protocol_representation]
    cautions:
      - "Conventional 12-EDO mappings are infrastructurally dominant but conceptually contingent."
    relations:
      - {relation: REPRESENTS, target: note}
      - {relation: OFTEN_CONFUSED_WITH, target: pitch}
    epistemic_status: [computational_abstraction, institutionally_standardized]
    sources: [midi-tuning-standard]
