senses:
- id: swing_setting.parameter
  orientation: A control that delays every second subdivision by a proportion of its length, expressed
    as a percentage, standardized by mid-1980s drum machines and samplers and inherited by most
    sequencers since.
  domains:
  - temporal_organization
  - computation
  - material_practice
  - metric_organization
  roles:
  - analytic_technology
  - travelling_system
  review_status: seed
  cautions:
  - A one-parameter family over a two-position pattern. It cannot express the unequal subdivision
    patterns documented in Malian jembe music, or most of what 'swing' names in jazz.
  - 50% is labelled 'no swing', which fixes the even case as the origin and everything else as
    a departure from it.
  - Specific values became stylistic signatures because specific machines had specific implementations.
    That is an equipment history, and it is now a genre history.
  relations:
  - relation: ABSTRACTS_FROM
    target: subdivision
  - relation: SHAPED_BY
    target: beat_grid
  - relation: POORLY_TRANSLATED_AS
    target: non_isochronous_metre
  - relation: CONSTRAINS
    target: microtiming
  epistemic_status:
  - computational_abstraction
  - institutionally_standardized
  sources:
