    roles: [tuning_practice, pitch_resource]
    cautions:
      - "A measured or encoded tuning is an instance or model, not sléndro itself."
    relations:
      - {relation: ILLUMINATES_ASPECT_OF, target: contextual_intonation}
    epistemic_status: [locally_named, demonstrated_in_practice]
