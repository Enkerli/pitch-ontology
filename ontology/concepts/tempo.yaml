  cautions:
  - A tempo number is meaningless without saying which level it counts, and that choice is often
    unstated.
  - 'Tempo is not the only thing that changes when music gets faster or slower: in Javanese practice
    a change of irama alters the density of parts against the colotomic cycle, which no single
    rate captures.'
