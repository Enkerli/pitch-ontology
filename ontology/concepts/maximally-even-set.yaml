    target: pitch_class_set
  - relation: ABSTRACTS_FROM
    target: rhythm
  - relation: ILLUMINATES_ASPECT_OF
    target: scale
  - relation: ILLUMINATES_ASPECT_OF
    target: timeline
  - relation: PARTIALLY_OVERLAPS
    target: rhythmic_oddity
  - relation: GENERATES
    target: euclidean_rhythm
  epistemic_status:
