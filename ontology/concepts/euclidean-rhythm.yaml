id: euclidean_rhythm
labels:
- text: Euclidean rhythm
  language: en
- text: E(k,n)
  language: en
  role: notation
senses:
- id: euclidean_rhythm.travelling
  orientation: A pattern produced by distributing k onsets as evenly as possible over n pulses,
    generated by the same recursion as Euclid's algorithm; proposed as an account of why many
    named patterns from many traditions take the shape they do.
  domains:
  - temporal_organization
  - computation
  - knowledge_provenance
  roles:
  - travelling_system
  - analytic_model
  - contested_concept
  review_status: seed
  cautions:
  - The match is real and the inference is the problem. That an algorithm outputs a string identical
    to a named pattern shows the string is maximally even; it does not show that evenness is why
    the pattern exists, that practitioners orient to it, or that patterns matching across traditions
    are the same object.
  - The representation is invariant under rotation. Clave direction is not. Whatever E(3,8) explains
    about tresillo, it cannot express the difference between 3-2 and 2-3 — and that difference
    is what makes a performance correct or incorrect.
  - It represents one part. Where patterns are interlocked, the analysed string is an extract
    from a composite that no player plays alone.
  - It has no place for stroke type, timbre, weight, dance relation, or the judgement 'out of
    clave' — all of which are how the named categories are actually individuated.
  - The literature it seeded now applies the apparatus to repertoires it was not derived from,
    which compounds rather than tests the inference.
  relations:
