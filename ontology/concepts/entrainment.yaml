  language: en
senses:
- id: entrainment.coordination
  orientation: The process by which a person's periodic behaviour locks to a periodic signal or
    to other people — the mechanism usually invoked to explain why a beat can be shared at all.
  domains:
  - ensemble_coordination
  - auditory_perception
  - temporal_organization
  roles:
  - mechanism
  - experimental_construct
  review_status: seed
  cautions:
  - Frequently used to argue that isochrony is fundamental. Entrainment to non-isochronous subdivision
    is as precise and stable, which removes that argument.
  - 'A capacity, not a norm: that people can entrain says nothing about whether a given practice
    is organized around doing so.'
  relations:
