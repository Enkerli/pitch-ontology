id: quantization-displaces-microtiming
subject: quantization
relation: DISPLACES
object: microtiming
aspect: Snapping events to a grid removes exactly the systematic timing relations that
  measurement identifies as structural, and the software then offers randomization as the
  remedy — which restores deviation without restoring system.
limit: A description of what the operation does, not a judgement of music made with it.
  Grid-quantized music is not deficient; it is differently organized, and its own timing
  practices are worth records of their own.
