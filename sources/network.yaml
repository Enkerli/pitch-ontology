    reference_key: 'ref42 (DOI 10.1017/S0261143001001337)'
    established_by: verified_reference_list
    confidence: high

  - from: temperley-ren-duan-2017-blue-notes-rock
    to: cutting-2019-microtonal-blue-notes
    type: CONTRASTS_WITH
    basis: >-
      Two computational descriptions of overlapping repertoire reaching incompatible
      conclusions: an alternation between two discrete pitches, against stable regions
      off the equal-tempered grid. Neither cites the other — Cutting is later, and
      Music Theory Online was not in Cutting's field of view.
    established_by: curatorial
    confidence: moderate

  - from: mcbride-passmore-tlusty-2023
    to: savage-2022-corpus-studies
    type: SAME_RESEARCH_PROGRAMME_AS
    basis: >-
      Both argue from assembled cross-cultural collections, and both have to decide
      that heterogeneous descriptions are commensurable before they can compare
      anything.
    established_by: curatorial
    confidence: high

