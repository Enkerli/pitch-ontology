    established_by: stated_in_source
    confidence: high

  # ---- verified citation edges ----
  #
  # Everything above is curatorial or stated in a source. The edges below are the
  # only ones in this file that assert an actual citation, and each was checked
  # against a reference list retrieved on 2026-09-07 from Crossref
  # (api.crossref.org/works/<doi>, the publisher's deposited reference list) and,
  # where the entry carried no DOI, corroborated against the OpenAlex
  # `referenced_works` array for the same document. `reference_key` names the entry
  # in the citing work's deposited list, so a reader can find it again.
  #
  # These sit alongside the curatorial edges rather than replacing them: three of
  # the pairs below already carry a curatorial edge saying what the relationship
  # *is*, which is a different question from who acknowledged whom.
  #
  # The network is thin because the bibliography is. Only 24 of 56 works resolve to
  # a DOI, most of the rest are museum records, specifications and web
  # documentation that no reference list indexes, and an edge is kept only when
  # both endpoints are already in works.yaml.

  - from: arom-furniss-1993
    to: kubik-african-tone-systems
    type: CITES
    basis: >-
      Kubik's reassessment is entry CIT0011 in the article's deposited reference
      list, asserted by the publisher as DOI 10.2307/768436.
    reference_key: 'CIT0011 (DOI 10.2307/768436)'
    established_by: verified_reference_list
    confidence: high

  - from: jacoby-2019-pitch-perception-singing
    to: furniss-2006-aka-polyphony
    type: CITES
    basis: >-
      Reference bib34 reads "Furniss, 2006, Aka polyphony: Music, theory, back and
      forth, Analytical Studies in World Music, 163" — the chapter held here.
      OpenAlex lists the same work in `referenced_works`.
    reference_key: '10.1016/j.cub.2019.08.020_bib34'
    established_by: verified_reference_list
    confidence: high

  - from: bozkurt-2014-makam-review
    to: bozkurt-2009-weighing-models
    type: CITES
    basis: >-
