    reference_key: 'ref6'
    established_by: verified_reference_list
    confidence: high

  - from: plos-2017-outliers-world-music
    to: jnmr-2013-computational-ethnomusicology
    type: CITES
    basis: >-
      Entry ref7, DOI 10.1080/09298215.2013.818038, asserted by Crossref. The outlier
